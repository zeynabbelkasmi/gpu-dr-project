# Single-change experiment (Week 3, A5.9): configs/exp_gpu_resident.yaml + preprocess.precompute
# (gamma/CLAHE/crop/normalize computed once on the GPU; each step only indexes the result).
#   python src/train.py --config configs/exp_precompute.yaml --device cuda
seed: 42
data:
  root: data/dr_dataset     # teacher layout; unused while split_csv is set
  split_csv: splits/splits.csv   # team split (StratifiedGroupKFold, patient-level, seed 42, 70/15/15).
                                 # Images resolved through src/paths.py (FDR26_DATA). Same split for every run.
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32
  num_workers: 2
  cache_dir: data/cache
  gpu_resident: true
preprocess:
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
  gpu: true
  precompute: true               # the only change vs exp_gpu_resident (A5.9)
train:
  model: reference_cnn
  epochs: 5
  lr: 0.001
  amp: false
  weight_decay: 0.0
  label_smoothing: 0.0
