# Your optimized configuration (assignment A6). Start from baseline.yaml and change
# ONE factor at a time, keeping a copy of each variant as configs/exp_<name>.yaml.
# Week 3 (A5 + A6): every optimization switched on. Each one is also measured alone in
# configs/exp_*.yaml. batch_size and num_workers keep the baseline values until the A5.8 /
# A6.7 sweeps (benchmarks/sweep_loader.py) give a measured optimum on the target GPU.
seed: 42
data:
  root: data/dr_dataset     # teacher layout; unused while split_csv is set
  split_csv: splits/splits.csv   # team split (StratifiedGroupKFold, patient-level, seed 42, 70/15/15).
                                 # Images resolved through src/paths.py (FDR26_DATA). Same split for every run.
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32            # A6.7: tune (throughput, GPU memory, validation accuracy)
  num_workers: 2            # A5.8: tune with benchmarks/sweep_loader.py
  prefetch_factor: 2        # A5.1: batches each worker keeps ready (needs num_workers > 0)
  cache_dir: data/cache     # A3: decoded uint8 cache (memory-mapped .npy); null disables it
  prefetch_gpu: true        # A5.5: overlap host-to-device copy with compute (CudaPrefetcher)
preprocess:
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
  gpu: true                 # A5.3: batched preprocessing on the GPU (loader returns uint8)
  # augment: false          # train-only flip + rotation (CPU path and GPU path both exist)
train:
  model: reference_cnn      # A6.6: resnet18 measured in configs/exp_resnet18.yaml
  epochs: 5
  lr: 0.001
  # scheduler: cosine
  amp: true                 # A6.1: mixed precision (autocast + GradScaler)
  channels_last: true       # A6.2: keep only if exp_channels_last.yaml shows a gain
  compile: false            # A6.3: optional, Linux only; measured in exp_compile.yaml
  weight_decay: 0.0
  label_smoothing: 0.0
