# Your optimized configuration (assignment A6). Start from baseline.yaml and change
# ONE factor at a time, keeping a copy of each variant as configs/exp_<name>.yaml.
# Keys read by the code are listed here; the code that reads them is a TODO in src/.
seed: 42
data:
  root: data/dr_dataset     # teacher layout; unused while split_csv is set
  split_csv: splits/splits.csv   # team split (StratifiedGroupKFold, patient-level, seed 42, 70/15/15).
                                 # Images resolved through src/paths.py (FDR26_DATA). Same split for every run.
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32            # TODO(A6.7): tune (throughput, GPU memory, validation accuracy)
  num_workers: 2            # TODO(A5.8): tune; find the point where more workers stop helping
  # prefetch_factor: 2      # TODO(A5.1): batches each worker keeps ready (needs num_workers > 0)
  cache_dir: data/cache     # A3: decoded uint8 cache (memory-mapped .npy); null disables it
  # prefetch_gpu: false     # TODO(A5.5): overlap host-to-device copy with compute
preprocess:
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
  # gpu: false              # TODO(A5.3): batched preprocessing on the GPU
  # augment: false          # train-only flip + rotation (CPU path and GPU path both exist)
train:
  model: reference_cnn      # TODO(A6.6): compare against a justified alternative
  epochs: 5
  lr: 0.001
  # scheduler: cosine
  # amp: false              # TODO(A6.1): mixed precision
  # channels_last: false    # TODO(A6.2): measure, do not assume
  # compile: false          # TODO(A6.3): torch.compile (needs Triton, i.e. Linux)
  weight_decay: 0.0
  label_smoothing: 0.0
